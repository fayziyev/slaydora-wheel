    var t0 = performance.now();
    (function glow(now) {
      draw({ off: off, a: 0.18 + 0.18 * Math.sin((now - t0) / 140) });
      lit = Math.floor(now / 300) % 2;
      if (now - t0 < 60000) requestAnimationFrame(glow);
    })(t0);
  }

  function claim() {
    haptic("medium");
    var link = "https://t.me/" + BOT + "?start=whd_" + GID;
    try { if (tg) { tg.openTelegramLink(link); setTimeout(function () { tg.close(); }, 400); return; } } catch (e) {}
    location.href = link;
  }

  $("spin").onclick = spin;
  $("claim").onclick = claim;
  $("close").onclick = function () { if (done) claim(); else if (tg) tg.close(); else history.back(); };
  $("friends").onclick = function () {
    var link = "https://t.me/" + BOT + (Q.get("u") ? "?start=r" + Q.get("u").replace(/[^0-9]/g, "") : "");
    var url = "https://t.me/share/url?url=" + encodeURIComponent(link) + "&text=" + encodeURIComponent(T.share);
    try { if (tg) { tg.openTelegramLink(url); return; } } catch (e) {}
    location.href = url;
  };

  var H = (Q.get("h") || "48").replace(/[^0-9]/g, "") || "48", C = (Q.get("c") || "10").replace(/[^0-9]/g, "") || "10";
  var WEEK = Q.get("w") !== "0";
  $("rTitle").textContent = T.rules; $("rClose").textContent = T.ok;
  T.R.forEach(function (sec) {
    var h = document.createElement("h3"); h.textContent = sec[0]; $("rBody").appendChild(h);
    var ul = document.createElement("ul");
    sec[1].forEach(function (x) {
      if (x.charAt(0) === "W") { if (!WEEK) return; x = x.slice(1); }
      var li = document.createElement("li"); li.textContent = x.replace("{h}", H).replace("{c}", C); ul.appendChild(li);
    });
    $("rBody").appendChild(ul);
  });
  $("info").onclick = function () { haptic("light"); $("sheet").classList.add("on"); };
  $("rClose").onclick = function () { $("sheet").classList.remove("on"); };
  $("sheet").onclick = function (e) { if (e.target === this) this.classList.remove("on"); };

  function setVh() {   // Telegram oynasining haqiqiy balandligi (kompyuterda oyna kichik)
    var h = (tg && tg.viewportStableHeight) || window.innerHeight;
    document.documentElement.style.setProperty("--vh", h + "px");
  }
  setVh();
  if (tg && tg.onEvent) try { tg.onEvent("viewportChanged", function () { setVh(); size(); }); } catch (e) {}
  window.addEventListener("resize", function () { setVh(); size(); });
  var go = function () {
    var l = $("loading");
    if (!l) return;
    try { size(); } catch (e) {}
    l.style.opacity = 0; l.id = ""; setTimeout(function () { l.remove(); }, 300);
  };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(go); else go();
  setTimeout(function () { if (document.getElementById("loading")) go(); }, 1500);
})();
</script>
</body>
